name: Monthly Health Check

# 매월 1일 오전 9시 KST (00:00 UTC) — 전체 시스템 상태 점검 + 알림

on:
  schedule:
    - cron: '0 0 1 * *'    # 매월 1일 00:00 UTC (KST 09:00)
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: 월간 시스템 점검

    steps:
      - name: Backend health check
        id: health
        run: |
          RESPONSE=$(curl -s --max-time 60 "${{ secrets.BACKEND_URL }}/api/health" || echo '{"status":"error"}')
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          echo "Backend: $RESPONSE"

      - name: Check ML model health
        id: ml_health
        run: |
          # 백엔드가 살아있으면 ML 상태도 확인
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 "${{ secrets.BACKEND_URL }}/api/health")
          if [ "$STATUS" = "200" ]; then
            echo "ml_ok=true" >> $GITHUB_OUTPUT
          else
            echo "ml_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Send monthly Discord report
        run: |
          MONTH=$(date +"%Y년 %m월")
          BACKEND_OK="${{ steps.health.outputs.response }}"
          ML_OK="${{ steps.ml_health.outputs.ml_ok }}"

          if echo "$BACKEND_OK" | grep -q '"ok"'; then
            BACKEND_STATUS="✅ 정상"
            COLOR=3066993
          else
            BACKEND_STATUS="❌ 오류"
            COLOR=15158332
          fi

          if [ "$ML_OK" = "true" ]; then
            ML_STATUS="✅ 정상"
          else
            ML_STATUS="⚠️ 확인 필요"
          fi

          MSG="**$MONTH 시스템 월간 점검 보고서**\n\n"
          MSG="${MSG}🖥️ **백엔드 서버**: $BACKEND_STATUS\n"
          MSG="${MSG}🤖 **ML 모델**: $ML_STATUS\n\n"
          MSG="${MSG}**이달 체크리스트**\n"
          MSG="${MSG}□ CockroachDB 데이터 사용량 확인 (10GB 한도)\n"
          MSG="${MSG}□ GitHub Actions 월 소비 분 확인 (2,000분 한도)\n"
          MSG="${MSG}□ 나라장터 최신 낙찰 데이터 수집 필요 시 실행\n"
          MSG="${MSG}□ 투찰 결과 미입력 건 처리\n\n"
          MSG="${MSG}**바로가기**: CockroachDB Console → Upstash Console → Render Dashboard"

          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"📊 BidAI Pro 월간 점검\",\"description\":\"$MSG\",\"color\":$COLOR,\"footer\":{\"text\":\"자동 실행 — GitHub Actions\"}}]}" \
            || echo "Discord webhook not configured"
