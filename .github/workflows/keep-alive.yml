name: Keep Backend Alive

# Fly.io: 절전모드 없음 (auto_stop_machines=false) — 이 워크플로는 서버 상태 확인 겸 UptimeRobot 보조용
# 30분 간격으로 실행 → 월 ~1,440분 (무료 한도 2,000분 이내)

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 (월 ~1,440분, 무료 한도 이내)
  workflow_dispatch:          # 수동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 55 \
            "${{ secrets.BACKEND_URL }}/api/health" || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Backend is alive."
          else
            echo "::warning::Backend returned $STATUS — Fly.io 머신 상태 확인 필요 (fly.io/dashboard)"
          fi
