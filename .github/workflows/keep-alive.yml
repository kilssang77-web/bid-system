name: Keep Backend Alive

# Render 무료 플랜: 15분 비활성 시 절전 모드
# GitHub Actions는 cron 지연이 있으므로 UptimeRobot(5분 간격)이 주 역할
# 이 워크플로는 UptimeRobot 장애 시 백업 역할 (14분 간격 핑)

on:
  schedule:
    - cron: '*/14 * * * *'   # 14분마다
  workflow_dispatch:          # 수동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            "${{ secrets.BACKEND_URL }}/api/health" || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend returned $STATUS (may be cold-starting)"
          fi
