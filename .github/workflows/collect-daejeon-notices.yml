name: 대전 입찰공고 수집 (inpo21c)

# 수동 실행 또는 매일 07:20 KST (22:20 UTC)
on:
  workflow_dispatch:
    inputs:
      region:
        description: '수집 지역 (기본: 대전)'
        required: false
        default: '대전'
      max_pages:
        description: '최대 페이지 수 (기본: 30)'
        required: false
        default: '30'
  schedule:
    - cron: '20 22 * * *'   # 매일 22:20 UTC = 07:20 KST

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: inpo21c 지역 공고 수집

    steps:
      - name: Render 웜업 (슬립 해제)
        run: |
          echo "Render 서버 웜업 중..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              "${{ secrets.BACKEND_URL }}/api/health" || echo "000")
            echo "  시도 $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 20
          done

      - name: 관리자 로그인 (토큰 발급)
        id: auth
        run: |
          RESP=$(curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.ADMIN_USERNAME }}\",\"password\":\"${{ secrets.ADMIN_PASSWORD }}\"}" \
            --max-time 15)
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "로그인 성공"

      - name: 수집 전 대전 공고 수 기록
        id: before
        run: |
          TOTAL=$(curl -sf "${{ secrets.BACKEND_URL }}/api/v1/bids?region_id=6&size=1" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            --max-time 15 | python3 -c "import sys,json; print(json.load(sys.stdin).get('total',0))" 2>/dev/null || echo "0")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "수집 전 대전 공고: $TOTAL 건"

      - name: inpo21c 지역 수집 (동기 실행 — 완료까지 대기)
        run: |
          REGION="${{ github.event.inputs.region || '대전' }}"
          PAGES="${{ github.event.inputs.max_pages || '30' }}"
          REGION_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$REGION'))")
          echo "수집 시작: 지역=$REGION, 페이지=$PAGES"
          RESP=$(curl -sf -X POST \
            "${{ secrets.BACKEND_URL }}/api/v1/admin/inpo21c/collect-notices?region=${REGION_ENC}&max_pages=${PAGES}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            --max-time 600)
          echo "수집 완료:"
          echo "$RESP" | python3 -c "
import sys, json
r = json.load(sys.stdin)
res = r.get('result', {})
sync = res.get('sync', {})
print(f'  신규 수집: {res.get(\"notices\",0)}건 / 스킵: {res.get(\"skipped\",0)}건')
print(f'  INSERT: {sync.get(\"inserted_new\",\"N/A\")}건 신규 bids 추가')
print(f'  region_id 동기화: {sync.get(\"region_id_from_notices\",0)}건')
if sync.get(\"insert_error\"):
    print(f'  INSERT 오류: {sync[\"insert_error\"][:100]}')
" 2>/dev/null || echo "응답 파싱 실패: $RESP"

      - name: 수집 결과 확인
        run: |
          TOKEN="${{ steps.auth.outputs.token }}"
          BEFORE="${{ steps.before.outputs.total }}"

          AFTER=$(curl -sf "${{ secrets.BACKEND_URL }}/api/v1/bids?region_id=6&size=1" \
            -H "Authorization: Bearer $TOKEN" --max-time 15 \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('total',0))" 2>/dev/null || echo "0")

          LATEST_LOG=$(curl -sf "${{ secrets.BACKEND_URL }}/api/v1/admin/collection-logs?limit=3" \
            -H "Authorization: Bearer $TOKEN" --max-time 15 2>/dev/null | \
            python3 -c "
import sys, json
logs = json.load(sys.stdin)
for l in logs[:3]:
    print(l['collect_type'], l['collected_at'][:19], 'ok='+str(l['success_count']))
" 2>/dev/null || echo "로그 조회 실패")

          echo "======================================="
          echo "수집 전 대전 공고: $BEFORE 건"
          echo "수집 후 대전 공고: $AFTER 건"
          echo "증가: $((AFTER - BEFORE)) 건"
          echo ""
          echo "최근 수집 로그:"
          echo "$LATEST_LOG"
          echo "======================================="
